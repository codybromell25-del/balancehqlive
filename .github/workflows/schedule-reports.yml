name: Schedule Momence reports

# Vercel's Hobby plan allows one cron invocation per day, which is not enough
# for this schedule. GitHub Actions runs the cadence instead and calls the same
# endpoint; public repositories get unlimited Actions minutes.
#
# Scheduled runs can be delayed when GitHub is busy. That is tolerable: the
# scheduler picks work by UTC hour and the report budget ledger refuses
# anything over the daily cap regardless.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  schedule-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Report every missing secret at once rather than one per re-run.
          missing=""
          [ -z "$APP_URL" ]     && missing="$missing APP_URL"
          [ -z "$CRON_SECRET" ] && missing="$missing CRON_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Values are masked in logs, so report shape rather than content.
          echo "APP_URL length: ${#APP_URL}"
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::APP_URL must start with https:// — got something else"; exit 1 ;;
          esac
          case "$APP_URL" in
            */) echo "::error::APP_URL has a trailing slash; remove it"; exit 1 ;;
          esac

      - name: Trigger report scheduling
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          code=$(curl -sS --max-time 120 -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/schedule-reports") || {
              echo "::error::curl could not reach $APP_URL — network error or bad host"
              exit 1
            }
          echo "HTTP $code"
          cat /tmp/body || true
          echo
          case "$code" in
            2*) echo "Report scheduling completed." ;;
            401) echo "::error::401 — CRON_SECRET does not match the value set in Vercel"; exit 1 ;;
            *)   echo "::error::Unexpected HTTP $code from the schedule endpoint"; exit 1 ;;
          esac
