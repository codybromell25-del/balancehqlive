    HostMembershipBasicDto:
      type: object
      properties:
        id:
          type: integer
          example: 5
        name:
          type: string
          example: Monthly Membership
        description:
          type: string
          nullable: true
          example: Monthly membership with unlimited access to <b>all</b> classes.
        type:
          type: string
          example: subscription
          enum:
            - subscription
            - on-demand-subscription
            - package-events
            - package-money
            - patron
          x-enumNames:
            - Subscription
            - OnDemandSubscription
            - PackageEvents
            - PackageMoney
            - Patron
        locationId:
          type: integer
          nullable: true
          example: null
        disabled:
          type: boolean
          description: Indicates that the membership was disabled
          example: false
        autoRenewing:
          type: boolean
          description: Indicates that membership renews after specific interval
          example: true
        minimumAutoRenews:
          type: integer
          nullable: true
          description: >-
            How many times membership has to renew before user can cancel
            renewal
          example: null
        eventCredits:
          type: integer
          nullable: true
          description: >-
            For PACKAGE_EVENTS memberships, defines how many event credits are
            included
          example: null
        moneyCredits:
          type: number
          nullable: true
          description: For PACKAGE_MONEY memberships, defines how much money is included
          example: null
        duration:
          type: integer
          nullable: true
          description: >-
            For SUBSCRIPTION this is auto renew duration, for PACKAGE_* this is
            expiration time
          example: 1
        durationUnit:
          type: string
          nullable: true
          example: months
          enum:
            - days
            - months
            - years
          x-enumNames:
            - DAYS
            - MONTHS
            - YEARS
        isActivatedOnFirstUse:
          type: boolean
          description: >-
            If set to false, membership is activated upon purchase. When set to
            true, membership is activated at the moment of the first purchase.
            When the purchase is for booking in the future, the activation date
            is set to the booking date.
          example: false
        activationDeadlineInDays:
          type: integer
          nullable: true
          description: >-
            Only applicable when isActivatedOnFirstUse=true. If set, the member
            must activate the membership within this many days of purchase or it
            expires automatically.
          example: 21
        hasFreeTrial:
          type: boolean
          example: false
        freeTrialDurationInDays:
          type: integer
          example: 7
        contractAgreement:
          type: string
          nullable: true
          example: Contract agreement text
        order:
          type: integer
          example: 1
        isIntroOffer:
          type: boolean
          example: false
        usageLimitForSessions:
          type: number
          nullable: true
          description: >-
            Only applicable for SUBSCRIPTION. Maximum number of sessions
            customer can book with this membership during one renewal period,
            not used when combinedUsageLimitEnabled=true
          example: 5
        usageLimitForAppointments:
          type: number
          nullable: true
          description: >-
            Only applicable for SUBSCRIPTION. Maximum number of appointments
            customer can book with this membership during one renewal period,
            not used when combinedUsageLimitEnabled=true
          example: 2
        combinedUsageLimitEnabled:
          type: boolean
          description: >-
            Only applicable for SUBSCRIPTION. The usage limits of the
            memberships are applied to sum of both bookings and appointments.
          example: false
        combinedUsageLimit:
          type: number
          nullable: true
          description: >-
            Only applicable for SUBSCRIPTION. Combined maximum number of
            bookings and appointments customer can book with this membership
            during one renewal period, only used when
            combinedUsageLimitEnabled=true
          example: null
        usageLimitRenewalEnabled:
          type: boolean
          description: >-
            Only applicable for SUBSCRIPTION. Calculate usage limits differently
            to renewal duration.
          example: false
        usageLimitRenewalDuration:
          type: number
          nullable: true
          description: >-
            Only applicable for SUBSCRIPTION. Interval for which the usage
            limits are calculated, only used when usageLimitRenewalEnabled=true
          example: null
        usageLimitRenewalDurationUnit:
          type: string
          nullable: true
          description: >-
            Only applicable for SUBSCRIPTION. Interval for which the usage
            limits are calculated, only used when usageLimitRenewalEnabled=true
          example: null
          enum:
            - days
            - months
            - years
          x-enumNames:
            - DAYS
            - MONTHS
            - YEARS
        usageLimitRolloverEnabled:
          type: boolean
          description: >-
            Only applicable for SUBSCRIPTION. When true and customer doesn't use
            reach their usage limits, the rest is transferred to the customer
            according to usageLimitRolloverMode
          example: false
        usageLimitRolloverMode:
          type: string
          nullable: true
          description: >-
            Only applicable for SUBSCRIPTION. How should extra usage limits be
            transferred to customer, either as package or as addition to next
            renewal period. Only used when usageLimitRolloverEnabled=true
          example: null
          enum:
            - next-renewal
            - event-credits
          x-enumNames:
            - NEXT_RENEWAL
            - EVENT_CREDITS
        usageLimitRolloverExpirationDuration:
          type: number
          nullable: true
          description: >-
            Only applicable for SUBSCRIPTION. When should the extra limits /
            package expire after rolling over. Only used when
            usageLimitRolloverEnabled=true
          example: null
        usageLimitRolloverExpirationDurationUnit:
          type: string
          nullable: true
          description: >-
            Only applicable for SUBSCRIPTION. When should the extra limits /
            package expire after rolling over. Only used when
            usageLimitRolloverEnabled=true
          example: null
          enum:
            - days
            - months
            - years
          x-enumNames:
            - DAYS
            - MONTHS
            - YEARS
      required:
        - id
        - name
        - description
        - type
        - locationId
        - disabled
        - autoRenewing
        - minimumAutoRenews
        - eventCredits
        - moneyCredits
        - duration
        - durationUnit
        - isActivatedOnFirstUse
        - activationDeadlineInDays
        - hasFreeTrial
        - freeTrialDurationInDays
        - contractAgreement
        - order
        - isIntroOffer
        - usageLimitForSessions
        - usageLimitForAppointments
        - combinedUsageLimitEnabled
        - combinedUsageLimit
        - usageLimitRenewalEnabled
        - usageLimitRenewalDuration
        - usageLimitRenewalDurationUnit
        - usageLimitRolloverEnabled
        - usageLimitRolloverMode
        - usageLimitRolloverExpirationDuration
        - usageLimitRolloverExpirationDurationUnit
    HostCheckoutCompatibleBoughtMembershipDto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        type:
          type: string
          example: subscription
          enum:
            - subscription
            - on-demand-subscription
            - package-events
