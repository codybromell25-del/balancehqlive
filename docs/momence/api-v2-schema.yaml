    ApiV2HostBoughtMembershipsDto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        type:
          type: string
          example: subscription
          enum:
            - subscription
            - on-demand-subscription
            - package-events
            - package-money
            - patron
          x-enumNames:
            - Subscription
            - OnDemandSubscription
            - PackageEvents
            - PackageMoney
            - Patron
        startDate:
          type: string
          nullable: true
          description: start date of the bought membership
          example: '2021-01-01T00:00:00Z'
          format: date-time
        endDate:
          type: string
          nullable: true
          description: expiration date of the bought membership
          example: '2021-02-01T00:00:00Z'
          format: date-time
        isFrozen:
          type: boolean
        eventCreditsLeft:
          type: number
          nullable: true
          description: number of event credits left, valid for PACKAGE_EVENTS
          example: null
        eventCreditsTotal:
          type: number
          nullable: true
          description: >-
            number of event credits originally included in the package, valid
            for PACKAGE_EVENTS
          example: null
        moneyCreditsLeft:
          type: number
          nullable: true
          description: number of money credits left, valid for PACKAGE_MONEY
          example: null
        moneyCreditsTotal:
          type: number
          nullable: true
          description: >-
            number of money credits originally included in the package, valid
            for PACKAGE_MONEY
          example: null
        usageLimitForSessions:
          type: number
          nullable: true
          description: >-
            Non-null value indicates the membership has limit to number of
            session bookings, only valid for SUBSCRIPTION
          example: 5
        usageLimitForAppointments:
          type: number
          nullable: true
          description: >-
            Non-null value indicates the membership has limit to number of
            appointments booked, only valid for SUBSCRIPTION
          example: 3
        combinedUsageLimit:
          type: number
          nullable: true
          description: >-
            Non-null value indicates the membership has combined limits for
            session and appointment bookings, only valid for SUBSCRIPTION
          example: null
        usedSessions:
          type: number
          nullable: true
          description: only valid for SUBSCRIPTION with session-only usage limits
          example: 1
        usedAppointments:
          type: number
          nullable: true
          description: only valid for SUBSCRIPTION with appointment-only usage limits
          example: 2
        combinedUsage:
          type: number
          nullable: true
          description: only valid for SUBSCRIPTION with combined usage limits
          example: null
        usageLimitStartDate:
          type: string
          nullable: true
          description: >-
            date range for which the current usage is calculated for, only valid
            for SUBSCRIPTION with usage limits
          example: null
          format: date-time
        usageLimitEndDate:
          type: string
          nullable: true
          description: >-
            date range for which the current usage is calculated for, only valid
            for SUBSCRIPTION with usage limits
          example: null
          format: date-time
        membership:
          nullable: true
          description: >-
            info about origin membership, it's possible the bought membership
            has no origin membership
          allOf:
            - $ref: '#/components/schemas/HostMembershipBasicDto'
        freeze:
          nullable: true
          description: >-
            freeze details, if the membership is frozen or scheduled to
            freeze/unfreeze
          allOf:
            - $ref: '#/components/schemas/ApiV2BoughtMembershipFreezeDto'
        declinedRenewal:
          nullable: true
          description: latest failed renewal payment details for this membership, if any
          allOf:
            - $ref: '#/components/schemas/ApiV2BoughtMembershipDeclinedRenewalDto'
      required:
        - id
        - type
        - startDate
        - endDate
        - isFrozen
        - eventCreditsLeft
        - eventCreditsTotal
        - moneyCreditsLeft
        - moneyCreditsTotal
        - usageLimitForSessions
        - usageLimitForAppointments
        - combinedUsageLimit
        - usedSessions
        - usedAppointments
        - combinedUsage
        - usageLimitStartDate
        - usageLimitEndDate
        - membership
        - freeze
        - declinedRenewal
