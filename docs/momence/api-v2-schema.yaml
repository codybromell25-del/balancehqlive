  /api/v2/host/sessions/{sessionId}/bookings/free:
    post:
      operationId: ApiV2HostSessionsController_addToSessionForFree
      summary: Add a member to a session for free
      description: >-
        This endpoint allows staff user to add a member to a session for free 
         
        | Error | Description |

        | --- | --- |

        | err-member-not-found | member not found |

        | err-member-not-assigned-to-host | member is not assigned to the host |

        | err-session-not-found | session not found |

        | err-session-not-provided-by-host | session not provided by the host |

        | err-customer-age-prevents-from-action | member is not eligible due to
        age restrictions |

        | err-missing-customer-date-of-birth | member is missing date of birth
        value |

        | err-missing-date-of-birth-setting | host is missing date of birth
        settings |

        | err-invalid-date-of-birth-value | member has invalid date of birth
        value |

        | err-session-not-recurring | session is not a recurring session |
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostFreeSessionBookingRequestDto'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostFreeSessionBookingResponseDto'
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostFreeSessionBookingErrorResponseDto'
      tags:
        - host
      security:
        - OAuth2: []
  /api/v2/host/sessions/{sessionId}/waitlist/bookings:
    post:
      operationId: ApiV2HostSessionsController_addToWaitlist
      summary: Add a member to a session waitlist
      description: >-
        This endpoint allows staff user to add a member to a session waitlist 
         
        **NOTE**: You can use the optional `useBoughtMembershipIds` field to
        provide a list of bought memberships that should be attempted to use
        during booking from the waitlist. If you don't provide anything here the
        best matching membership will be used automatically. 
         
        | Error | Description |

        | --- | --- |

        | err-waitlist-not-allowed | session does not have waitlist enabled |

        | err-waitlist-full | session waitlist is full |

        | err-member-already-on-waitlist | member is already on the waitlist |

        | err-member-not-found | member not found |

        | err-member-not-assigned-to-host | member is not assigned to the host |

        | err-session-not-found | session not found |

        | err-session-not-provided-by-host | session not provided by the host |

        | err-customer-age-prevents-from-action | member is not eligible due to
        age restrictions |

        | err-missing-customer-date-of-birth | member is missing date of birth
        value |

        | err-missing-date-of-birth-setting | host is missing date of birth
        settings |

        | err-invalid-date-of-birth-value | member has invalid date of birth
        value |
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostSessionWaitlistBookingRequestDto'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostSessionWaitlistBookingResponseDto'
          description: ''
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/HostSessionWaitlistBookingErrorResponseDto
      tags:
        - host
      security:
        - OAuth2: []
