openapi: 3.0.0
paths:
  /api/v2/auth/authorize:
    get:
      operationId: ApiV2AuthController_authorize
      summary: OAuth2 authorize
      parameters:
        - name: client_id
          required: false
          in: query
          schema:
            type: string
        - name: redirect_uri
          required: false
          in: query
          schema:
            type: string
        - name: prompt
          required: false
          in: query
          description: |-
            Indicates possible user prompts:

             - login (default): show Sign In screen; if a user is logged in, they are logged out first
             - sign-up: show Sign Up screen; if a user is logged in, they are logged out first
             - none: no prompt, throw when user isn't logged in
          x-enumNames:
            - LOGIN
            - SIGN_UP
            - NONE
          schema:
            enum:
              - login
              - sign-up
              - none
            type: string
        - name: scope
          required: false
          in: query
          x-enumNames:
            - PUBLIC_API_V2
          schema:
            enum:
              - public-api-v2
            type: string
        - name: response_type
          required: false
          in: query
          x-enumNames:
            - CODE
          schema:
            enum:
              - code
            type: string
        - name: state
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags:
        - auth
      security:
        - OAuth2ApiClient: []
  /api/v2/auth/token:
    post:
      operationId: ApiV2AuthController_token
      summary: OAuth2 token
      description: Obtain a new access token
      parameters: []
      requestBody:
